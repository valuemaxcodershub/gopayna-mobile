workflows:
  ios-testflight:
    name: iOS TestFlight (Auto Signing)
    max_build_duration: 90
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gopayna.app3
    scripts:
      - flutter pub get
      - cd ios && pod install
      - flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
